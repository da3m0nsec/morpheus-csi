apiVersion: v1
kind: ServiceAccount
metadata:
  name: morpheus-csi-node
  namespace: kube-system
  labels:
    app.kubernetes.io/name: morpheus-csi
    app.kubernetes.io/component: node
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: morpheus-csi-node
  labels:
    app.kubernetes.io/name: morpheus-csi
    app.kubernetes.io/component: node
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: morpheus-csi-node
  labels:
    app.kubernetes.io/name: morpheus-csi
    app.kubernetes.io/component: node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: morpheus-csi-node
subjects:
  - kind: ServiceAccount
    name: morpheus-csi-node
    namespace: kube-system
