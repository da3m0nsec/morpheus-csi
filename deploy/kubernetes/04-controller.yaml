apiVersion: apps/v1
kind: Deployment
metadata:
  name: morpheus-csi-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: morpheus-csi
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: morpheus-csi
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: morpheus-csi
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: morpheus-csi-controller
      priorityClassName: system-cluster-critical
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.3.0
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election
            - --timeout=60s
            - --v=2
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.9.0
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election
            - --timeout=60s
            - --v=2
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: morpheus-csi-driver
          image: ghcr.io/da3m0nsec/morpheus-csi:dev
          imagePullPolicy: IfNotPresent
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --driver-name=csi.morpheusdata.com
            - --mode=controller
            - --log-level=info
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: MORPHEUS_URL
              valueFrom:
                secretKeyRef:
                  name: morpheus-csi-credentials
                  key: MORPHEUS_URL
            - name: MORPHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: morpheus-csi-credentials
                  key: MORPHEUS_TOKEN
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9808
            - --v=2
          ports:
            - name: healthz
              containerPort: 9808
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
