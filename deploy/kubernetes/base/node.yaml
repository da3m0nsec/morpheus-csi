apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: morpheus-csi-node
  labels:
    app.kubernetes.io/name: morpheus-csi
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: morpheus-csi
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: morpheus-csi
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: morpheus-csi-node
      priorityClassName: system-node-critical
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.14.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.morpheusdata.com/csi.sock
            - --v=2
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: morpheus-csi-driver
          image: ghcr.io/da3m0nsec/morpheus-csi:main
          imagePullPolicy: Always
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --driver-name=csi.morpheusdata.com
            - --mode=node
            - --node-id=$(NODE_ID)
            - --kubelet-root-path=/var/lib/kubelet
            - --log-level=info
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MORPHEUS_URL
              valueFrom:
                secretKeyRef:
                  name: morpheus-csi-credentials
                  key: MORPHEUS_URL
            - name: MORPHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: morpheus-csi-credentials
                  key: MORPHEUS_TOKEN
            - name: MORPHEUS_INSECURE_SKIP_VERIFY
              valueFrom:
                secretKeyRef:
                  name: morpheus-csi-credentials
                  key: MORPHEUS_INSECURE_SKIP_VERIFY
                  optional: true
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: device-dir
              mountPath: /dev
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9808
            - --v=2
          ports:
            - name: healthz
              containerPort: 9808
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.morpheusdata.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory
